[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_local_engine"
version = "0.1.0"
description = "Local-First SQLite & Hybrid Vector Database Sync Engine for Desktop & Mobile"
dependencies = ["pydantic"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ai-sync = "ai_local_engine.cli:main"
